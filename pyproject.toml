[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "sabotage-game-demo"
version = "0.1.0"
description = "Local-network hidden-role party game prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Gaurav Dama" }]
dependencies = ["Flask>=3.0,<4"]

[dependency-groups]
dev = [
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
py-modules = ["sabotageGame"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"sabotageGame.py" = ["E501"]
"tests/**" = ["S101"]
